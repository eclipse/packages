# This profile provides a minimal setup of Hono that is suitable for walking through
# Hono's Getting Started guide using a local Kubernetes cluster.
# This profile is supposed to be used with Hono chart versions starting from 2.7.0.

grafana:
  enabled: false

prometheus:
  createInstance: false

jaegerBackendExample:
  enabled: false

kafka:
  controller:
    resources:
      requests:
        cpu: "150m"
        memory: "1500Mi"
      limits:
        memory: "1500Mi"
    extraConfig: |
      group.initial.rebalance.delay.ms=0
      offsets.topic.replication.factor=1
      transaction.state.log.min.isr=1
      transaction.state.log.replication.factor=1
      log.flush.interval.messages=1000
      log.flush.interval.ms=1000
      log.retention.bytes=10485760
      log.retention.check.interval.ms=300000
      log.retention.hours=1
      log.segment.bytes=10485760

adapters:
  http:
    enabled: true
    imageName: "eclipsehono/hono-adapter-http-native"
    resources:
      requests:
        cpu: "50m"
        memory: "120Mi"
      limits:
        memory: "120Mi"

  mqtt:
    enabled: true
    imageName: "eclipsehono/hono-adapter-mqtt-native"
    resources:
      requests:
        cpu: "50m"
        memory: "120Mi"
      limits:
        memory: "120Mi"

  amqp:
    enabled: false

  coap:
    enabled: false

  kura:
    enabled: false

  lora:
    enabled: false

authServer:
  imageName: "eclipsehono/hono-service-auth-native"
  resources:
    requests:
      cpu: "50m"
      memory: "60Mi"
    limits:
      memory: "60Mi"

deviceRegistryExample:
  type: "embedded"
  embeddedJdbcDeviceRegistry:
    imageName: "eclipsehono/hono-service-device-registry-jdbc"
    resources:
      requests:
        cpu: "100m"
        memory: "400Mi"
      limits:
        memory: "400Mi"

dataGridExample:
  enabled: false

commandRouterService:
  imageName: "eclipsehono/hono-service-command-router-native"
  resources:
    requests:
      cpu: "50m"
      memory: "140Mi"
    limits:
      memory: "140Mi"
