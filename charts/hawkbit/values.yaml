---
# Default values for hawkbit.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: "hawkbit/hawkbit-update-server"
  tag: '0.10.0'
  pullPolicy: IfNotPresent
  initContainer: "hawkbit/hawkbit-repository-jpa-init"

# auth configuration
auth:
  # if set, must contain key: application-user-credentials.yaml
  existingSecret: ""
  username: "admin"
  password: "{noop}admin"
  dmfPassword: "[KEYCLOAK_HAWKBIT_USER_PASSWORD]"

replicaCount: 1

## podDisruptionBudget configuration
podDisruptionBudget:
  enabled: false
  minAvailable: 1

## Pod Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext:
  enabled: true
  # 65534 is the uid of user nobody in the docker image
  fsGroup: 65534
  runAsUser: 65534
  extra: {}

## strategy used to replace old Pods by new ones
## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
updateStrategy:
  ## default is re-create, because of possible database migrations
  type: Recreate

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}
    # traefik.ingress.kubernetes.io/affinity: "true"

livenessProbe:
  initialDelaySeconds: 240
  timeoutSeconds: 5
readinessProbe:
  initialDelaySeconds: 120
  timeoutSeconds: 5

ingress:
  enabled: false
  ingressClassName:
  annotations: {}
    # ingress.kubernetes.io/ssl-redirect: "true"
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: hawkbit.local
      paths: []
  tls: []
  #  - secretName: hawkbit-tls
  #    hosts:
  #      - hawkbit.local

routes:
  enabled: false
  tls: true

# enable local file storage
fileStorage:
  enabled: true
  pvcSize: "1Gi"
  mountPath: "/artifactrepo"

# optional env vars
extraEnv: []
# - name: JAVA_TOOL_OPTIONS:
#   value: "-Xms1024m -Xmx1024m"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 500m
  #  memory: 1536Mi
  # requests:
  #  cpu: 100m
  #  memory: 1024Mi

nodeSelector: {}

tolerations: []

affinity: {}

podTemplate:
  annotations: {}

extraVolumes: []
extraVolumeMounts: []

configMap:
  mountPath: "/app/config"

spring:
  profiles: "mysql"

config:
  application:
    server:
      useForwardHeaders: true
    hawkbit:

## dependency charts config
## External database configuration (used when mysql.enabled=false).
## type: mysql (default) or postgresql
externalDatabase:
  type: mysql
  host: ""
  port: ""
  database: hawkbit
  user: ""
  password: ""  # used when existingSecret is not set
  url: ""  # optional: override the full JDBC URL
  existingSecret: ""  # must contain keys: SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD

## ref: https://github.com/bitnami/charts/blob/master/bitnami/mysql/values.yaml
mysql:
  enabled: true
  primary:
    persistence:
      enabled: true
  volumePermissions:
    enabled: true
  architecture: standalone
  auth:
    # The secret has to contain the keys mysql-root-password, mysql-replication-password and mysql-password
    existingSecret: ""
    username: hawkbit
    password: hawkbit
    database: hawkbit
  metrics:
    enabled: true

## ref: https://github.com/bitnami/charts/blob/master/bitnami/rabbitmq/values.yaml
rabbitmq:
  # hawkbit chart: if set, must contain keys SPRING_RABBITMQ_USERNAME and SPRING_RABBITMQ_PASSWORD;
  # generated from rabbitmq.auth.username and rabbitmq.auth.password if not set
  credentialsSecret: ""
  # external RabbitMQ hostname (used when rabbitmq.enabled=false and microservices.enabled=true)
  host: ""
  enabled: true
  persistence:
    enabled: true
  volumePermissions:
    enabled: true
  auth:
    existingPasswordSecret: ""
    existingSecretPasswordKey: rabbitmq-password
    username: hawkbit
    password: hawkbit
  metrics:
    enabled: true

## Microservices mode — deploy mgmt, ddi, dmf as separate pods instead of the monolith
microservices:
  enabled: false
  mgmt:
    image:
      repository: "hawkbit/hawkbit-mgmt-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
  ddi:
    image:
      repository: "hawkbit/hawkbit-ddi-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}
    # Ingress paths routed to the DDI server (e.g., ["/DEFAULT/controller"])
    ingressPaths: []
  dmf:
    image:
      repository: "hawkbit/hawkbit-dmf-server"
      tag: "0.10.0"
      pullPolicy: IfNotPresent
    replicaCount: 1
    resources: {}

## hawkbitgui — optional Next.js management UI
gui:
  enabled: false
  image:
    repository: "ghcr.io/joshua-clayton/hawkbitgui"
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  nextauth:
    # NEXTAUTH_URL: full public URL of the GUI (e.g., https://hawkbit.example.com)
    url: "http://localhost:3000"
    # existingSecret must contain key: NEXTAUTH_SECRET
    existingSecret: ""
  resources: {}
