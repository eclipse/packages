{{- if .Values.microservices.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hawkbit.fullname" . }}-mgmt
  labels:
{{ include "hawkbit.labels" . | indent 4 }}
    app.kubernetes.io/component: mgmt
spec:
  replicas: {{ .Values.microservices.mgmt.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hawkbit.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mgmt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hawkbit.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mgmt
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podTemplate.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
        - name: hawkbit-init
          image: "{{ .Values.image.initContainer }}:{{ .Values.microservices.mgmt.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.mgmt.image.pullPolicy }}
          env:
            - name: HAWKBIT_DB_MODE
              value: "migrate"
            - name: PROFILES
              value: {{ include "hawkbit.spring.profiles" . | quote }}
            - name: AND_THEN
              value: "true"
          envFrom:
            - secretRef:
                name: {{ include "hawkbit.dbCredentialsSecretName" . }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
    {{- with .Values.microservices.mgmt.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: hawkbit-mgmt
          image: "{{ .Values.microservices.mgmt.image.repository }}:{{ .Values.microservices.mgmt.image.tag }}"
          imagePullPolicy: {{ .Values.microservices.mgmt.image.pullPolicy }}
          env:
            - name: PROFILES
              value: {{ include "hawkbit.spring.profiles" . | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            {{- if .Values.fileStorage.enabled }}
            - name: ORG_ECLIPSE_HAWKBIT_ARTIFACT_FS_PATH
              value: {{ .Values.fileStorage.mountPath }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- if kindIs "slice" .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- else if kindIs "map" .Values.extraEnv }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: "{{ $key }}"
              value: "{{ $value }}"
            {{- end }}
            {{- end }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "hawkbit.dbCredentialsSecretName" . }}
            - secretRef:
                name: {{ include "hawkbit.rabbitmqCredentialsSecretName" . }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          volumeMounts:
            - name: configmap
              mountPath: {{ .Values.configMap.mountPath }}
            - name: secret-config
              mountPath: /secret-config
              readOnly: true
            {{- if .Values.fileStorage.enabled }}
            - name: storage
              mountPath: {{ .Values.fileStorage.mountPath }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          resources:
{{ toYaml .Values.microservices.mgmt.resources | indent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      {{- if .Values.securityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.securityContext.fsGroup }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- if .Values.securityContext.extra }}
        {{- toYaml .Values.securityContext.extra | nindent 8 }}
        {{- end }}
      {{- end }}
      volumes:
        - name: configmap
          configMap:
            name: {{ include "hawkbit.fullname" . }}
        - name: secret-config
          projected:
            sources:
              - secret:
                  name: {{ include "hawkbit.userCredentialsSecretName" . }}
                  items:
                    - key: application-user-credentials.yaml
                      path: application-user-credentials.yaml
      {{- if .Values.fileStorage.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "hawkbit.fullname" . }}-data
      {{- end }}
      {{- if .Values.extraVolumes }}
      {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
{{- end }}
